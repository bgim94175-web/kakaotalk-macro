name: APK 빌드

# 브랜치에 푸시될 때마다, 그리고 수동 실행(Actions 탭 → Run workflow)으로 돌린다.
on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    name: KakaoAuto · KakaoAdmin
    runs-on: ubuntu-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 안드로이드 SDK 설치
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: 빌드 스크립트 실행권한
        run: chmod +x android/build.sh

      - name: APK 빌드 (auto + admin)
        working-directory: android
        env:
          # 레포 Settings → Secrets → Actions 에 KEYSTORE_B64 를 넣어두면 그 키로 서명한다.
          # (base64 -w0 android/keystore/app.jks 결과를 그대로 붙여넣기)
          # 비워두면 레포에 커밋된 keystore/app.jks 를 그대로 쓴다.
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          # 키스토어 비밀번호. Secret 이 비어있으면 build.sh 가 기본값으로 떨어지고
          # 로그에 "기본 키스토어 비밀번호를 쓰고 있어" 경고를 찍는다.
          # 레포를 공개로 전환할 거면 KEYSTORE_B64 + KS_PASS 두 개를 반드시 Secret 으로 넣어라.
          KS_PASS: ${{ secrets.KS_PASS }}
        run: ./build.sh all

      - name: 빌드 결과 확인
        run: ls -lh android/out

      - name: 사용자앱 APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: KakaoAuto
          path: android/out/KakaoAuto_v*.apk
          if-no-files-found: error
          retention-days: 90

      - name: 관리자앱 APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: KakaoAdmin
          path: android/out/KakaoAdmin_v*.apk
          if-no-files-found: error
          retention-days: 90
