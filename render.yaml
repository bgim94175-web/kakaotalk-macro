services:
  - type: web
    name: kakao-license
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false      # Neon 연결 문자열
      - key: ADMIN_PASSWORD
        sync: false
      - key: SIGNING_PRIVATE_KEY
        sync: false
