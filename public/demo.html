<main id="main" tabindex="-1">
  <div class="wrap pub-page">
    <div class="pub-head">
      <p class="eyebrow">체험</p>
      <h1>K bot 체험</h1>
      <p class="lead">카카오톡 방과 같은 화면에서 미니게임봇, 방 관리봇, 매크로가 하는 일을 확인합니다. 체험 중에는 실제 카카오톡에 아무것도 보내지 않습니다.</p>
    </div>

    <!-- 장면 목록(왼쪽 · 좁으면 위 탭) · 카카오톡 방(가운데) · 설명과 버튼(오른쪽 · 좁으면 방 아래). 내용은 demo.js 가 /api/demo 로 채운다 -->
    <div class="demo" id="demoWrap">
      <nav class="demo-scenes" id="demoScenes" aria-label="체험 장면" aria-busy="true">
        <span class="sk demo-sk-tab"></span><span class="sk demo-sk-tab"></span><span class="sk demo-sk-tab"></span>
      </nav>

      <section class="demo-head" aria-labelledby="demoTitle">
        <p class="demo-kind" id="demoKind"><span class="sk demo-sk-kind"></span></p>
        <h2 id="demoTitle"><span class="sk demo-sk-title"></span></h2>
        <p class="demo-desc" id="demoDesc"><span class="sk demo-sk-line"></span><span class="sk demo-sk-line short"></span></p>
        <div class="demo-ctrls" id="demoCtrls" hidden></div>
      </section>

      <div class="demo-stage">
        <div class="kk-dev">
          <div class="kk" id="kk">
            <div class="kk-top">
              <span class="kk-ib" aria-hidden="true"><svg class="ic" width="20" height="20"><use href="#i-back"></use></svg></span>
              <p class="kk-title"><b id="kkName">K bot 체험방</b><span class="kk-count" id="kkCount"></span></p>
              <span class="kk-ib" aria-hidden="true"><svg class="ic" width="19" height="19"><use href="#i-search"></use></svg></span>
              <span class="kk-ib" aria-hidden="true"><svg class="ic" width="20" height="20"><use href="#i-menu"></use></svg></span>
            </div>
            <div class="kk-body">
              <button type="button" class="kk-notice" id="kkNotice" aria-expanded="false" hidden>
                <svg class="ic kk-notice-ic" width="18" height="18" aria-hidden="true"><use href="#i-notice"></use></svg>
                <span class="sr">공지</span><span class="kk-notice-t" id="kkNoticeT"></span>
                <svg class="ic kk-notice-chev" width="16" height="16" aria-hidden="true"><use href="#i-down"></use></svg>
              </button>
              <div class="kk-log" id="kkLog" role="log" aria-live="polite" aria-labelledby="kkName" tabindex="0">
                <div class="kk-state" id="kkState"><span class="spin" aria-hidden="true"></span><span>체험 화면을 준비하는 중…</span></div>
              </div>
              <button type="button" class="kk-newpill" id="kkNew" hidden>
                <span class="kk-new-who" id="kkNewWho"></span><span class="kk-new-t" id="kkNewT"></span>
                <svg class="ic" width="16" height="16" aria-hidden="true"><use href="#i-down"></use></svg>
              </button>
            </div>
            <form class="kk-in" id="kkForm" autocomplete="off">
              <span class="kk-plus" aria-hidden="true"><svg class="ic" width="20" height="20"><use href="#i-plus"></use></svg></span>
              <label class="sr" for="kkText">메시지 입력</label>
              <textarea class="kk-ta" id="kkText" rows="1" maxlength="1000" placeholder="메시지 입력" enterkeyhint="send"></textarea>
              <button type="submit" class="kk-send" id="kkSend" aria-label="보내기" disabled><span><svg class="ic" width="17" height="17" aria-hidden="true"><use href="#i-send"></use></svg></span></button>
            </form>
          </div>
        </div>
        <div class="note demo-hint" id="demoHint" role="status" hidden><span class="ic" aria-hidden="true">i</span><span id="demoHintT"></span></div>
      </div>

      <section class="demo-play" id="demoPlay" aria-label="체험 버튼" hidden>
        <div class="demo-acts-w" id="demoActsW" hidden><p class="demo-cap">상황 만들기</p><div class="demo-acts" id="demoActs"></div></div>
        <div class="demo-chips-w" id="demoChipsW" hidden><p class="demo-cap">바로 입력</p><div class="demo-chips" id="demoChips"></div></div>
      </section>

      <section class="demo-side" aria-label="K bot 패널 기록과 구매">
        <ol class="demo-recs" id="demoRecs" aria-live="polite" hidden></ol>
        <div class="demo-foot">
          <a class="btn primary lg" id="demoBuy" href="/buy" hidden>구매</a>
          <button type="button" class="btn lg" id="demoRestart" disabled><svg class="ic" width="15" height="15" aria-hidden="true"><use href="#i-refresh"></use></svg>다시 시작</button>
        </div>
      </section>
    </div>
  </div>
</main>
